<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Inner shapes (Bars & Dot) -->
  <g transform="translate(0, 10)">
    <!-- Orange dot -->
    <circle cx="70" cy="95" r="12" fill="#F48C46" />
    
    <!-- Three ascending bars -->
    <rect x="95" y="105" width="18" height="25" fill="#ffffff" />
    <rect x="120" y="85" width="18" height="45" fill="#ffffff" />
    <rect x="145" y="65" width="18" height="65" fill="#ffffff" />
  </g>

  <!-- The white G shape wrapping everything -->
  <!-- We'll draw it using a path with a thick stroke -->
  <path d="M 170,50 A 85,85 0 1,0 120,180" fill="none" stroke="#ffffff" stroke-width="35" stroke-linecap="butt" />
</svg>
